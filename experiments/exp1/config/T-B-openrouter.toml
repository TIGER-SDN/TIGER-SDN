# Ported from sdn-intent-framework:research/experiments/eval/config/T-B-openrouter.toml (see docs/PROVENANCE.md)
[experiment]
treatment      = "T-B"
description    = "IR Zero-Shot — IntentIR 형식, few-shot 없음, grounding 없음"
output_format  = "intent_ir"
few_shot       = false
grounding      = false
dataset_path   = "research/experiments/eval/data/gold350_eval.jsonl"
topology_path  = "research/experiments/eval/data/topology_eval.json"
demos_path     = ""

[llm]
model          = "qwen/qwen3-8b"
temperature    = 0.2
max_tokens     = 8192
timeout_s      = 120.0
retries        = 2
