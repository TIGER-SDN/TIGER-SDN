[project]
name = "tiger-sdn"
version = "0.1.0"
description = "Natural language intent to ONOS FlowRule pipeline, with a verifiable intermediate representation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11,<3",
    "python-dotenv>=1.2,<2",
]

[dependency-groups]
dev = ["pytest>=8.4,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiger_sdn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
