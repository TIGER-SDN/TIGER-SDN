name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Run pytest
        run: |
          set +e
          pytest
          code=$?
          set -e
          # exit code 5 = no tests collected, which is expected pre-Stage-1
          if [ $code -ne 0 ] && [ $code -ne 5 ]; then
            exit $code
          fi
